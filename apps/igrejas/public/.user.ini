; Limites de upload do PHP para o cPanel (hospedagem compartilhada) - o
; padrao do php.ini global costuma ser 2-8MB, insuficiente pro upload de
; audios do modulo Playbacks (ate 25MB, ver PlaybackController).
upload_max_filesize = 30M
post_max_size = 32M
max_execution_time = 120
max_input_time = 120
